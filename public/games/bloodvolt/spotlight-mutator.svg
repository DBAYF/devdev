<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 822" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="822" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a0008"/>
      <stop offset="1" stop-color="#080c12"/>
    </linearGradient>
    <radialGradient id="m" cx="0.6" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ff2040" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff2040" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ff2040" stroke-width="1" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1920" height="822" fill="url(#bg)"/>
  <rect width="1920" height="822" fill="url(#grid)"/>
  <rect width="1920" height="822" fill="url(#m)"/>
  <!-- giant blood-moon disc -->
  <circle cx="1340" cy="411" r="240" fill="#ff2040" opacity="0.18"/>
  <circle cx="1340" cy="411" r="180" fill="none" stroke="#ff2040" stroke-width="3" opacity="0.55"/>
  <circle cx="1340" cy="411" r="120" fill="none" stroke="#ff2040" stroke-width="2" opacity="0.4"/>
</svg>
