<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 215" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="460" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1408"/>
      <stop offset="0.55" stop-color="#1a2010"/>
      <stop offset="1" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="banana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.55" stop-color="#fde047"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.65" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fde047" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="460" height="215" fill="url(#bg)"/>
  <rect width="460" height="215" fill="url(#grid)"/>
  <rect width="460" height="215" fill="url(#glow)"/>

  <!-- The banana, dead centre right -->
  <g transform="translate(290 108) rotate(-18)">
    <!-- Body -->
    <path d="M -110 -8
             Q -130 -50, -60 -70
             Q 30 -82, 110 -50
             Q 130 -38, 122 -22
             Q 116 -14, 106 -22
             Q 60 -52, 0 -42
             Q -60 -32, -82 16
             Q -90 38, -106 38
             Q -126 38, -122 18
             Q -118 0, -110 -8 Z"
          fill="url(#banana)" stroke="#854d0e" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- Top stem -->
    <path d="M 110 -50 L 124 -62 L 130 -50 L 122 -38 Z"
          fill="#854d0e" stroke="#451a03" stroke-width="1"/>
    <!-- Bottom blossom tip -->
    <circle cx="-118" cy="32" r="5" fill="#451a03"/>
    <!-- Inner highlight curve -->
    <path d="M -90 -8 Q -40 -36, 30 -34 Q 80 -32, 100 -22"
          fill="none" stroke="#fef9c3" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Title block -->
  <text x="22" y="56" font-family="-apple-system,'Inter',sans-serif"
    font-size="34" font-weight="900" fill="#fff" letter-spacing="-1">LabForge<tspan fill="#fde047" font-size="20"> ·TD</tspan></text>
  <text x="22" y="78" font-family="ui-monospace,'JetBrains Mono',monospace"
    font-size="10" font-weight="700" fill="#fde047" letter-spacing="3">STEM TOWER DEFENCE</text>
  <text x="22" y="200" font-family="ui-monospace,'JetBrains Mono',monospace"
    font-size="9" font-weight="700" fill="#a3a3a3" letter-spacing="2.5">SIGNED BY ZOMISCUOUS</text>
</svg>
