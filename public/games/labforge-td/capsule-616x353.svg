<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 353" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="616" y2="353" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1408"/>
      <stop offset="0.55" stop-color="#1a2010"/>
      <stop offset="1" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="banana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.55" stop-color="#fde047"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fde047" stroke-width="0.6" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="616" height="353" fill="url(#bg)"/>
  <rect width="616" height="353" fill="url(#grid)"/>
  <rect width="616" height="353" fill="url(#glow)"/>

  <!-- Distant glow disc -->
  <circle cx="500" cy="60" r="22" fill="#fde047" opacity="0.55"/>

  <!-- Hero banana, scaled up -->
  <g transform="translate(396 196) scale(1.35) rotate(-18)">
    <path d="M -110 -8
             Q -130 -50, -60 -70
             Q 30 -82, 110 -50
             Q 130 -38, 122 -22
             Q 116 -14, 106 -22
             Q 60 -52, 0 -42
             Q -60 -32, -82 16
             Q -90 38, -106 38
             Q -126 38, -122 18
             Q -118 0, -110 -8 Z"
          fill="url(#banana)" stroke="#854d0e" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M 110 -50 L 124 -62 L 130 -50 L 122 -38 Z"
          fill="#854d0e" stroke="#451a03" stroke-width="1"/>
    <circle cx="-118" cy="32" r="5" fill="#451a03"/>
    <path d="M -90 -8 Q -40 -36, 30 -34 Q 80 -32, 100 -22"
          fill="none" stroke="#fef9c3" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Title -->
  <text x="36" y="92" font-family="-apple-system,'Inter',sans-serif"
    font-size="62" font-weight="900" fill="#fff" letter-spacing="-1">LabForge</text>
  <text x="36" y="142" font-family="-apple-system,'Inter',sans-serif"
    font-size="44" font-weight="900" fill="#fde047" letter-spacing="-1">·TD</text>
  <text x="36" y="178" font-family="ui-monospace,'JetBrains Mono',monospace"
    font-size="14" font-weight="700" fill="#fde047" letter-spacing="5">STEM TOWER DEFENCE</text>
  <text x="36" y="332" font-family="ui-monospace,'JetBrains Mono',monospace"
    font-size="11" font-weight="700" fill="#a3a3a3" letter-spacing="3">SIGNED BY ZOMISCUOUS</text>
</svg>
